name: Check PRDH cards branch
on:
  push:
    branches: [feature/prdh-research-cards]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Jekyll site without deploying
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
