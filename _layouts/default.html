<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title }}</title><meta name="description" content="{{ site.description | escape }}"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,560;9..144,640&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><script>(function(){try{var t=localStorage.getItem("gg-theme");if(!t&&window.matchMedia("(prefers-color-scheme: dark)").matches)t="dark";if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script><link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header class="top"><a class="brand" href="{{ '/' | relative_url }}">G<span>·</span>G <small>RESEARCH ATLAS</small></a><nav><a href="{{ '/' | relative_url }}">Candidates</a><a href="{{ '/about/' | relative_url }}">About the research</a><a href="{{ '/research-log/' | relative_url }}">Research log</a><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">☾</button></nav></header><main>{{ content }}</main><footer><p>Gendron / Gendreau Research Atlas · Research status: 10 November 2026 · Source images are not hosted here.</p><p>Historical research assessments, not independently certified identity determinations.</p></footer><script>window.GG_BASE = "{{ '' | relative_url }}";</script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="{{ '/assets/js/maps.js' | relative_url }}"></script><script>(function(){var b=document.getElementById("theme-toggle");if(!b)return;function glyph(){b.textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀":"☾";}b.addEventListener("click",function(){var d=document.documentElement.getAttribute("data-theme")==="dark";if(d){document.documentElement.removeAttribute("data-theme");try{localStorage.setItem("gg-theme","light")}catch(e){}}else{document.documentElement.setAttribute("data-theme","dark");try{localStorage.setItem("gg-theme","dark")}catch(e){}}glyph();});glyph();})();</script></body></html>
